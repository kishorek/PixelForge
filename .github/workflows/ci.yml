name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: zig-0.14.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Zig
        run: npm run zig:install

      - name: Zig unit tests
        run: npm run wasm:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (includes WASM validation)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
